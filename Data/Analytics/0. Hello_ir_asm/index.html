<!DOCTYPE html>
<html>
<head>
    <title>Analysis Dashboard</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Anton&family=Share+Tech+Mono&display=swap');

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: "Anton", sans-serif;
            background: #000000;
            color: #204ef1;
            overflow: hidden;
        }

        .tab-container {
            display: flex;
            background: transparent;
            padding: 20px 20px 20px 20px;
            gap: 10px;
        }

        .tab {
            padding: 10px 35px;
            cursor: pointer;
            color: #dce5f4;
            background: rgba(45, 45, 45, 0.6);
            border: 2px solid #204ef1;
            font-family: "Anton", sans-serif;
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 2px;
            transition: all 0.3s ease;
            position: relative;
            border-radius: 10px;
            display: inline-block;
        }

        .tab::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(180deg, rgba(32, 78, 241, 0.1), transparent);
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .tab:hover {
            background: rgba(32, 78, 241, 0.3);
            color: #28b0f3;
            box-shadow: 
                0 0 15px rgba(32, 78, 241, 0.5),
                inset 0 1px 0 rgba(220, 229, 244, 0.2);
        }

        .tab:hover::before {
            opacity: 1;
        }

        .tab.active {
            background: rgba(39, 31, 54, 0.95);
            color: #ffffff;
            border-color: #28b0f3;
            z-index: 10;
            box-shadow: 
                0 0 25px rgba(40, 176, 243, 0.6),
                inset 0 2px 0 rgba(40, 176, 243, 0.6);
        }

        .tab.active::before {
            opacity: 0;
        }

        .content-frame {
            width: 100%;
            height: calc(100vh - 94px);
            border: none;
            display: none;
            background: #000000;
        }

        .content-frame.active {
            display: block;
        }
    </style>
</head>
<body>
    <div class="tab-container">
        <button class="tab active" onclick="switchTab('ir', event)">
            IR Pattern Analysis
        </button>
        <button class="tab" onclick="switchTab('asm', event)">
            ASM Foorprint Analysis
        </button>
        <button class="tab" onclick="switchTab('cross', event)">
            Cross Reference Analysis
        </button>
    </div>
    
    <iframe id="ir-frame" class="content-frame active" src="ir_visualizer.html"></iframe>
    <iframe id="asm-frame" class="content-frame" src="asm_visualizer.html"></iframe>
    <iframe id="cross-frame" class="content-frame" src="cross_visualizer.html"></iframe>
    
    <script>
        const lastTab = localStorage.getItem('activeTab') || 'ir';
        
        function switchTab(tabName, event) {
            localStorage.setItem('activeTab', tabName);            
            document.querySelectorAll('.tab').forEach(tab => {
                tab.classList.remove('active');
            });
            event.target.classList.add('active');            
            document.querySelectorAll('.content-frame').forEach(frame => {
                frame.classList.remove('active');
            });
            document.getElementById(tabName + '-frame').classList.add('active');
        }
        
        if (lastTab !== 'ir') {
            window.addEventListener('DOMContentLoaded', () => {
                const tabs = document.querySelectorAll('.tab');
                tabs.forEach(tab => {
                    const tabText = tab.textContent.toLowerCase();
                    if ((lastTab === 'asm' && tabText.includes('asm')) ||
                        (lastTab === 'ir' && tabText.includes('ir')) ||
                        (lastTab === 'cross' && tabText.includes('cross'))) {
                        tab.click();
                    }
                });
            });
        }
    </script>
</body>
</html>
