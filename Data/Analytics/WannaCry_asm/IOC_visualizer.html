<!DOCTYPE html>
<html>
<head>
    <title>IOC Comparison Analysis</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Anton&family=Share+Tech+Mono&display=swap');
        
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body { 
            font-family: "Anton", sans-serif;
            background: #000000;
            color: #204ef1;
            line-height: 1.6;
            padding: 20px;
            background-image: 
                repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(32, 78, 241, 0.03) 2px, rgba(32, 78, 241, 0.03) 4px);
        }
        
        .container { max-width: 1600px; margin: 0 auto; }
        
        .terminal-header {
            border: 2px solid #204ef1;
            border-bottom: none;
            padding: 10px 20px;
            background: rgba(39, 31, 54, 0.3);
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .terminal-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #204ef1;
        }
        
        .terminal-title {
            margin-left: 15px;
            color: #dce5f4;
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        
        .card { 
            background: rgba(45, 45, 45, 0.95);
            border: 2px solid #204ef1;
            margin: 0 0 30px 0;
            position: relative;
            box-shadow: 0 0 20px rgba(32, 78, 241, 0.3);
        }
        
        .card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 1px;
            background: linear-gradient(90deg, transparent, #204ef1, transparent);
        }
        
        .card-content {
            padding: 25px;
            font-family: "Share Tech Mono";
        }
        
        h1 { 
            color: #ffffff; 
            font-size: 36px;
            margin-bottom: 30px;
            text-transform: uppercase;
            letter-spacing: 4px;
            text-shadow: 0 0 5px rgba(220, 229, 244, 0.5);
            border-left: 4px solid #204ef1;
            padding-left: 20px;
        }
        
        h2 { 
            color: #dce5f4;
            font-size: 18px;
            text-transform: uppercase;
            letter-spacing: 3px;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 1px solid #204ef1;
            font-family: "Anton", sans-serif;
        }
        
        h2::before {
            content: '> ';
            color: #204ef1;
        }
        
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }
        
        .stat { 
            background: rgba(39, 31, 54, 0.5);
            border: 1px solid #204ef1;
            padding: 20px;
            text-align: center;
            position: relative;
            overflow: hidden;
        }
        
        .stat::after {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(220, 229, 244, 0.1), transparent);
            animation: scan 3s infinite;
        }
        
        @keyframes scan {
            0% { left: -100%; }
            100% { left: 100%; }
        }
        
        .stat-value { 
            font-size: 42px; 
            font-weight: bold; 
            color: #e7eaeb;
            text-shadow: 0 0 10px rgba(40, 176, 243, 1);
            display: block;
            margin-bottom: 5px;
            font-family: "Anton", sans-serif;
        }
        
        .stat-label { 
            color: #dce5f4; 
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        
        .hash-stats {
            margin: 20px 0;
            padding: 20px;
            background: rgba(39, 31, 54, 0.3);
            border-left: 3px solid #28b0f3;
        }
        
        .hash-stat-item {
            padding: 10px;
            margin: 5px 0;
            background: rgba(39, 31, 54, 0.3);
            border-left: 2px solid #204ef1;
            color: #fbfbfb;
            font-size: 13px;
        }

        .hash-stat-item::before {
            content: '[+] ';
            color: #28b0f3;
        }

        .hash-stat-item-clickable {
            cursor: pointer;
            color: #E0CAA1;
            transition: all 0.3s ease;
        }

        .hash-stat-item-clickable:hover {
            color: #C6AE73;
            text-shadow: 0 0 8px rgba(198, 174, 115, 0.5);
        }

        .popup-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            z-index: 1000;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .popup-overlay.show {
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .popup-overlay.visible {
            opacity: 1;
        }

        .popup-content {
            position: relative;
            max-width: 800px;
            width: 90%;
            max-height: 80vh;
            overflow-y: auto;
            transform: scale(0.7);
            opacity: 0;
            transition: all 0.3s ease;
        }

        .popup-content.visible {
            transform: scale(1);
            opacity: 1;
        }

        .popup-close {
            position: absolute;
            top: -40px;
            right: 0;
            background: rgba(173, 131, 48, 0.3);
            border: 2px solid #AD8330;
            color: #E0CAA1;
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 24px;
            font-weight: bold;
            transition: all 0.3s ease;
        }

        .popup-close:hover {
            background: rgba(173, 131, 48, 0.5);
            box-shadow: 0 0 15px rgba(224, 202, 161, 0.8);
        }

        .popup-hash-container {
            background: rgba(45, 45, 45, 0.95);
            border: 2px solid #AD8330;
            box-shadow: 0 0 20px rgba(173, 131, 48, 0.3);
            padding: 25px;
        }

        .popup-hash-title {
            color: #E0CAA1;
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 3px;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 1px solid #AD8330;
            font-family: "Anton", sans-serif;
        }

        .popup-hash-title::before {
            content: '> ';
            color: #AD8330;
        }

        .popup-hash-value {
            color: #e8c896;
            font-size: 12px;
            margin-bottom: 20px;
            word-break: break-all;
            font-family: "Share Tech Mono";
        }

        .popup-indicators {
            background: rgba(39, 31, 54, 0.3);
            padding: 15px;
            border-left: 3px solid #d4a574;
        }

        .popup-indicator-item {
            padding: 8px;
            margin: 5px 0;
            background: rgba(39, 31, 54, 0.3);
            border-left: 2px solid #d4a574;
            color: #fbfbfb;
            font-size: 13px;
            font-family: "Share Tech Mono";
        }

        .popup-indicator-item::before {
            content: '[+] ';
            color: #e8c896;
        }
        
        .ioc-group {
            margin: 20px 0;
            padding: 20px;
            background: rgba(39, 31, 54, 0.3);
            border: 2px solid #204ef1;
            transition: all 0.3s ease;
        }
        
        .ioc-group:hover {
            background: rgba(39, 31, 54, 0.5);
            box-shadow: 0 0 15px rgba(32, 78, 241, 0.5);
        }
        
        .ioc-name {
            font-weight: bold;
            color: #dce5f4;
            margin-bottom: 15px;
            font-size: 16px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        
        .hash-match-badge {
            display: inline-block;
            padding: 3px 10px;
            background: rgba(255, 69, 0, 0.3);
            border: 1px solid #ff4500;
            color: #ff6347;
            font-size: 10px;
            margin-left: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        
        .hash-entry {
            margin: 15px 0;
            padding: 15px;
            background: rgba(39, 31, 54, 0.2);
            border-left: 3px solid #28b0f3;
        }
        
        .hash-value {
            color: #28b0f3;
            font-size: 12px;
            margin-bottom: 10px;
            word-break: break-all;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .hash-value:hover {
            color: #d4a574;
            text-shadow: 0 0 8px rgba(212, 165, 116, 0.5);
        }
        
        .hash-value::before {
            content: '> ';
            color: #204ef1;
        }
        
        .indicator-item {
            padding: 5px 0;
            margin-left: 20px;
            color: #fbfbfb;
            font-size: 12px;
        }
        
        .indicator-item::before {
            content: '[+] ';
            color: #204ef1;
        }
        
        .whitelist-group {
            margin: 20px 0;
            padding: 20px;
            background: rgba(220, 229, 244, 0.1);
            border: 2px solid #dce5f4;
            transition: all 0.3s ease;
        }
        
        .whitelist-group:hover {
            background: rgba(220, 229, 244, 0.15);
            box-shadow: 0 0 15px rgba(220, 229, 244, 0.3);
        }
        
        .whitelist-group .ioc-name {
            color: #f5f5f5;
        }
        
        .whitelist-group .hash-entry {
            border-left-color: #e0e0e0;
        }
        
        .whitelist-group .hash-value {
            color: #f0f0f0;
        }
        
        .whitelist-group .indicator-item::before {
            color: #dce5f4;
        }
        
        .no-data {
            text-align: center;
            padding: 40px;
            color: #dce5f4;
            font-size: 14px;
            background: rgba(39, 31, 54, 0.3);
            border: 1px dashed #204ef1;
        }
        
        .filter-controls {
            margin: 20px 0;
            padding: 15px;
            background: rgba(39, 31, 54, 0.3);
            border: 1px solid #204ef1;
        }
        
        .search-input {
            width: 100%;
            padding: 10px;
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid #204ef1;
            color: #dce5f4;
            font-family: "Share Tech Mono";
            font-size: 14px;
        }
        
        .search-input:focus {
            outline: none;
            border-color: #28b0f3;
            box-shadow: 0 0 10px rgba(40, 176, 243, 0.3);
        }
        
        .search-input::placeholder {
            color: #204ef1;
        }
        
        ::-webkit-scrollbar {
            width: 10px;
        }
        
        ::-webkit-scrollbar-track {
            background: #000000;
        }
        
        ::-webkit-scrollbar-thumb {
            background: #204ef1;
            border: 1px solid #271f36;
        }
        
        ::-webkit-scrollbar-thumb:hover {
            background: #dce5f4;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>IOC COMPARISON ANALYSIS</h1>
        
        <div class="terminal-header">
            <div class="terminal-dot"></div>
            <div class="terminal-dot"></div>
            <div class="terminal-dot"></div>
            <div class="terminal-title">Summary Statistics</div>
        </div>
        <div class="card">
            <div class="card-content">
                <div class="stats-grid">
                    <div class="stat">
                        <span class="stat-value" id="total-hashes">0</span>
                        <span class="stat-label">Total Hashes</span>
                    </div>
                    <div class="stat">
                        <span class="stat-value" id="total-iocs">0</span>
                        <span class="stat-label">IOC Groups</span>
                    </div>
                    <div class="stat">
                        <span class="stat-value" id="total-indicators">0</span>
                        <span class="stat-label">Total Indicators</span>
                    </div>
                    <div class="stat">
                        <span class="stat-value" id="whitelisted-count">0</span>
                        <span class="stat-label">Whitelisted</span>
                    </div>
                </div>
            </div>
        </div>
        
        <div class="terminal-header">
            <div class="terminal-dot"></div>
            <div class="terminal-dot"></div>
            <div class="terminal-dot"></div>
            <div class="terminal-title">Top Hashes by IOC Count</div>
        </div>
        <div class="card">
            <div class="card-content">
                <div id="hash-stats-container"></div>
            </div>
        </div>
        
        <div class="terminal-header">
            <div class="terminal-dot"></div>
            <div class="terminal-dot"></div>
            <div class="terminal-dot"></div>
            <div class="terminal-title">IOC Matches</div>
        </div>
        <div class="card">
            <div class="card-content">
                <div class="filter-controls">
                    <input type="text" id="search-input" class="search-input" placeholder="Filter IOCs (e.g., advapi32, cmd, hash)...">
                </div>
                <div id="iocs-container"></div>
            </div>
        </div>
        
        <div id="whitelist-section" class="whitelist-section" style="display: none;">
            <div class="terminal-header">
                <div class="terminal-dot"></div>
                <div class="terminal-dot"></div>
                <div class="terminal-dot"></div>
                <div class="terminal-title">Whitelisted Indicators</div>
            </div>
            <div class="card">
                <div class="card-content">
                    <div id="whitelist-container"></div>
                </div>
            </div>
        </div>
    </div>
    
    <script>
        let reportData = null;
        let allIocs = [];
        
        async function loadData() {
            try {
                const response = await fetch('ioc_comparison_report.json');
                reportData = await response.json();
                return reportData;
            } catch (error) {
                console.error('error loading IOC comparison data:', error);
                return null;
            }
        }
        
        async function init() {
            const data = await loadData();
            if (!data) {
                document.body.innerHTML = '<div class="container"><div class="no-data">Failed to load ioc_comparison_report.json</div></div>';
                return;
            }
            
            // update statistics
            document.getElementById('total-hashes').textContent = data.total_hashes || 0;
            document.getElementById('total-iocs').textContent = data.total_ioc_groups || 0;
            document.getElementById('total-indicators').textContent = data.total_indicators || 0;
            document.getElementById('whitelisted-count').textContent = data.whitelisted_total_indicators || 0;
            
            // render sections
            renderHashStats(data.hash_statistics);
            renderIOCs(data.ioc_matches);
            renderWhitelist(data.whitelisted_matches);
        
            // setup search
            document.getElementById('search-input').addEventListener('input', handleSearch);
        }
        
        function renderHashStats(hashStats) {
            const container = document.getElementById('hash-stats-container');
            
            if (!hashStats || hashStats.length === 0) {
                container.innerHTML = '<div class="no-data">No Hash Statistics Available</div>';
                return;
            }
            
            container.innerHTML = '<div class="hash-stats">' +
                hashStats.map(stat => {
                    const displayHash = stat.hash.length > 64 ? stat.hash.substring(0, 64) + '...' : stat.hash;
                    let foundIOC = null;
                    for (const [iocName, hashes] of Object.entries(reportData.ioc_matches)) {
                        if (hashes[stat.hash]) {
                            foundIOC = iocName;
                            break;
                        }
                    }
                    
                    if (foundIOC) {
                        return `<div class="hash-stat-item">
                            <span class="hash-stat-item-clickable" onclick="showHashPopup('${stat.hash.replace(/'/g, "\\'")}', '${foundIOC.replace(/'/g, "\\'")}')">
                                ${displayHash}
                            </span>: ${stat.ioc_count} IOC(s)
                        </div>`;
                    } else {
                        return `<div class="hash-stat-item">${displayHash}: ${stat.ioc_count} IOC(s)</div>`;
                    }
                }).join('') +
                '</div>';
        }

        function showHashPopup(hash, iocName) {
            let allIndicators = [];
            let iocGroupsMap = {};
            
            for (const [name, hashes] of Object.entries(reportData.ioc_matches)) {
                if (hashes[hash]) {
                    const indicators = hashes[hash];
                    allIndicators = allIndicators.concat(indicators);
                    
                    indicators.forEach(ind => {
                        if (!iocGroupsMap[ind]) {
                            iocGroupsMap[ind] = [];
                        }
                        iocGroupsMap[ind].push(name);
                    });
                }
            }
            
            allIndicators = [...new Set(allIndicators)];
            
            if (allIndicators.length === 0) {
                console.error('No indicators found for hash:', hash);
                return;
            }
            
            allIndicators.sort((a, b) => {
                const aIsHash = a.startsWith('HASH:');
                const bIsHash = b.startsWith('HASH:');
                if (aIsHash && !bIsHash) return -1;
                if (!aIsHash && bIsHash) return 1;
                return a.localeCompare(b);
            });
            
            const indicatorHTML = allIndicators.map(ind => {
                const groups = iocGroupsMap[ind] || [];
                const groupBadges = groups.length > 1 
                    ? `<span style="color: #e8c896; font-size: 11px; margin-left: 10px;">[${groups.length} IOC groups]</span>` 
                    : '';
                return `<div class="popup-indicator-item">${ind}${groupBadges}</div>`;
            }).join('');
            
            const popupHTML = `
                <div class="popup-overlay" id="hashPopup" onclick="closePopupOnOverlay(event)">
                    <div class="popup-content">
                        <div class="popup-close" onclick="closeHashPopup()">×</div>
                        <div class="terminal-header" style="border-color: #d4a574;">
                            <div class="terminal-dot" style="background: #d4a574;"></div>
                            <div class="terminal-dot" style="background: #d4a574;"></div>
                            <div class="terminal-dot" style="background: #d4a574;"></div>
                            <div class="terminal-title" style="color: #e8c896;">Hash Details</div>
                        </div>
                        <div class="popup-hash-container">
                            <div class="popup-hash-title">Hash</div>
                            <div class="popup-hash-value">${hash}</div>
                            <div class="popup-hash-title">All Indicators (${allIndicators.length})</div>
                            <div class="popup-indicators">
                                ${indicatorHTML}
                            </div>
                        </div>
                    </div>
                </div>
            `;
            
            document.body.insertAdjacentHTML('beforeend', popupHTML);
            const popup = document.getElementById('hashPopup');
            const content = popup.querySelector('.popup-content');
            
            setTimeout(() => {
                popup.classList.add('show');
                setTimeout(() => {
                    popup.classList.add('visible');
                    content.classList.add('visible');
                }, 10);
            }, 10);
        }

        function closeHashPopup() {
            const popup = document.getElementById('hashPopup');
            const content = popup.querySelector('.popup-content');
            
            popup.classList.remove('visible');
            content.classList.remove('visible');
            
            setTimeout(() => {
                popup.remove();
            }, 300);
        }

        function closePopupOnOverlay(event) {
            if (event.target.classList.contains('popup-overlay')) {
                closeHashPopup();
            }
        }
        
        function renderIOCs(iocMatches) {
            const container = document.getElementById('iocs-container');
            
            if (!iocMatches || Object.keys(iocMatches).length === 0) {
                container.innerHTML = '<div class="no-data">No IOC Matches Found</div>';
                return;
            }
            
            allIocs = Object.entries(iocMatches);
            displayIOCs(allIocs, container);
        }
        
        function displayIOCs(iocs, container) {
            if (iocs.length === 0) {
                container.innerHTML = '<div class="no-data">No Matches Found</div>';
                return;
            }
            
            container.innerHTML = iocs.map(([iocName, hashes]) => {
                const isHashMatch = iocName === '[HASH MATCH]';
                return `
                    <div class="ioc-group">
                        <div class="ioc-name">
                            ${iocName}
                            ${isHashMatch ? '<span class="hash-match-badge">HASH MATCH</span>' : ''}
                        </div>
                        ${Object.entries(hashes).map(([hash, indicators]) => {
                            const displayHash = hash.length > 64 ? hash.substring(0, 64) + '...' : hash;
                            return `
                                <div class="hash-entry">
                                    <div class="hash-value" onclick="showHashPopup('${hash.replace(/'/g, "\\'")}', '${iocName.replace(/'/g, "\\'")}')">${displayHash}</div>
                                    ${indicators.map(ind => `<div class="indicator-item">${ind}</div>`).join('')}
                                </div>
                            `;
                        }).join('')}
                    </div>
                `;
            }).join('');
        }
        
        function renderWhitelist(whitelistMatches) {
            if (!whitelistMatches || Object.keys(whitelistMatches).length === 0) {
                return;
            }
            
            document.getElementById('whitelist-section').style.display = 'block';
            const container = document.getElementById('whitelist-container');
            
            container.innerHTML = Object.entries(whitelistMatches).map(([iocName, hashes]) => {
                const isHashMatch = iocName === '[HASH MATCH]';
                return `
                    <div class="whitelist-group">
                        <div class="ioc-name">
                            ${iocName}
                            ${isHashMatch ? '<span class="hash-match-badge">HASH MATCH</span>' : ''}
                        </div>
                        ${Object.entries(hashes).map(([hash, indicators]) => {
                            const displayHash = hash.length > 64 ? hash.substring(0, 64) + '...' : hash;
                            return `
                                <div class="hash-entry">
                                    <div class="hash-value">${displayHash}</div>
                                    ${indicators.map(ind => `<div class="indicator-item">${ind}</div>`).join('')}
                                </div>
                            `;
                        }).join('')}
                    </div>
                `;
            }).join('');
        }
        
        function handleSearch(e) {
            const query = e.target.value.toLowerCase().trim();
            const container = document.getElementById('iocs-container');
            
            if (!query) {
                displayIOCs(allIocs, container);
                return;
            }
            
            const filtered = allIocs.filter(([iocName, hashes]) => {
                if (iocName.toLowerCase().includes(query)) return true;
                
                return Object.entries(hashes).some(([hash, indicators]) => {
                    if (hash.toLowerCase().includes(query)) return true;
                    return indicators.some(ind => ind.toLowerCase().includes(query));
                });
            });
            
            displayIOCs(filtered, container);
        }
        
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', init);
        } else {
            init();
        }
    </script>
</body>
</html>
