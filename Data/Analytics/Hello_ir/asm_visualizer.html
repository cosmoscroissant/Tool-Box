<!DOCTYPE html>
<html>
<head>
    <title>ASM Footprint Sniffer</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/plotly.js/2.26.0/plotly.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Anton&family=Share+Tech+Mono&display=swap');
        
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body { 
            font-family: "Anton", sans-serif;
            font-weight: 400;
            font-style: normal;
            background: #000000;
            color: #204ef1;
            line-height: 1.6;
            padding: 20px;
            background-image: 
                repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(32, 78, 241, 0.03) 2px, rgba(32, 78, 241, 0.03) 4px);
        }
        
        .container { max-width: 1600px; margin: 0 auto; }
        
        .terminal-header {
            border: 2px solid #204ef1;
            border-bottom: none;
            padding: 10px 20px;
            background: rgba(39, 31, 54, 0.3);
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .terminal-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #204ef1;
        }
        
        .terminal-title {
            margin-left: 15px;
            color: #dce5f4;
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        
        .card { 
            background: rgba(45, 45, 45, 0.95);
            border: 2px solid #204ef1;
            margin: 0 0 30px 0;
            position: relative;
            box-shadow: 0 0 20px rgba(32, 78, 241, 0.3);
        }
        
        .card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 1px;
            background: linear-gradient(90deg, transparent, #204ef1, transparent);
        }
        
        .card-content {
            padding: 25px;
        }
        
        h1 { 
            color: #ffffff; 
            font-size: 36px;
            margin-bottom: 30px;
            text-transform: uppercase;
            letter-spacing: 4px;
            text-shadow: 0 0 5px rgba(220, 229, 244, 0.5);
            border-left: 4px solid #204ef1;
            padding-left: 20px;
        }
        
        h2 { 
            color: #dce5f4;
            font-size: 18px;
            text-transform: uppercase;
            letter-spacing: 3px;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 1px solid #204ef1;
        }
        
        h2::before {
            content: '> ';
            color: #204ef1;
        }
        
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }
        
        .stat { 
            background: rgba(39, 31, 54, 0.5);
            border: 1px solid #204ef1;
            padding: 20px;
            text-align: center;
            position: relative;
            overflow: hidden;
        }
        
        .stat::after {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(220, 229, 244, 0.1), transparent);
            animation: scan 3s infinite;
        }
        
        @keyframes scan {
            0% { left: -100%; }
            100% { left: 100%; }
        }
        
        .stat-value { 
            font-size: 42px; 
            font-weight: bold; 
            color: #e7eaeb;
            text-shadow: 0 0 10px rgba(40, 176, 243, 1);
            display: block;
            margin-bottom: 5px;
        }
        
        .stat-label { 
            color: #dce5f4; 
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        
        .file-result {
            font-family: "Share Tech Mono";
            margin: 20px 0;
            padding: 20px;
            background: rgba(39, 31, 54, 0.3);
            border-left: 3px solid #204ef1;
            transition: all 0.3s ease;
        }
        
        .file-result:hover {
            background: rgba(39, 31, 54, 0.5);
            border-left-width: 5px;
        }
        
        .file-result.has-error {
            border-left-color: #f12020;
        }
        
        .file-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            cursor: pointer;
        }
        
        .file-name {
            font-weight: bold;
            color: #dce5f4;
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        
        .file-badge {
            display: inline-block;
            padding: 4px 12px;
            background: rgba(32, 78, 241, 0.3);
            border: 1px solid #204ef1;
            font-size: 11px;
            color: #dce5f4;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        
        .file-badge.error {
            background: rgba(241, 32, 32, 0.3);
            border-color: #f12020;
        }
        
        .file-content {
            padding-left: 20px;
        }
        
        .file-content.collapsed {
            display: none;
        }
        
        .hash-section {
            margin: 15px 0;
            padding: 15px;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid #204ef1;
        }
        
        .hash-title {
            color: #204ef1;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 10px;
        }
        
        .hash-item {
            padding: 5px 0;
            color: #fbfbfb;
            font-size: 12px;
            word-break: break-all;
        }
        
        .hash-label {
            color: #dce5f4;
            font-weight: bold;
            text-transform: uppercase;
        }
        
        .ioc-category {
            margin: 15px 0;
        }
        
        .category-title {
            color: #28b0f3;
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 10px;
            padding: 8px 12px;
            background: rgba(40, 176, 243, 0.1);
            border-left: 3px solid #28b0f3;
        }
        
        .ioc-list {
            margin-left: 20px;
        }
        
        .ioc-item {
            padding: 6px 0;
            color: #fbfbfb;
            font-size: 12px;
            word-break: break-all;
            transition: color 0.2s ease;
        }
        
        .ioc-item:hover {
            color: #28b0f3;
        }
        
        .ioc-item::before {
            content: '[+] ';
            color: #204ef1;
        }
        
        .error-message {
            color: #f12020;
            padding: 10px;
            background: rgba(241, 32, 32, 0.1);
            border: 1px solid #f12020;
            font-size: 12px;
        }
        
        .controls {
            margin: 15px 0;
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
            padding: 15px;
            background: rgba(39, 31, 54, 0.3);
            border: 1px solid #204ef1;
        }
        
        label {
            font-family: "Share Tech Mono";
            color: #dce5f4;
            text-transform: uppercase;
            font-size: 12px;
            letter-spacing: 1px;
        }
        
        select, input {
            padding: 10px 15px;
            border: 1px solid #204ef1;
            background: rgba(45, 45, 45, 0.8);
            color: #dce5f4;
            font-family: "Share Tech Mono";
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        select:hover, input:hover {
            border-color: #dce5f4;
            box-shadow: 0 0 10px rgba(32, 78, 241, 0.5);
        }
        
        input[type="text"] {
            min-width: 250px;
        }
        
        .btn { 
            padding: 10px 25px; 
            background: linear-gradient(135deg, #204ef1, #271f36);
            color: #fbfbfb; 
            border: 1px solid #204ef1;
            cursor: pointer; 
            font-size: 12px;
            font-family: "Share Tech Mono";
            font-weight: 400;
            font-style: normal;
            text-transform: uppercase;
            letter-spacing: 2px;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }
        
        .btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: rgba(220, 229, 244, 0.2);
            transition: left 0.3s ease;
        }
        
        .btn:hover::before {
            left: 100%;
        }
        
        .btn:hover {
            box-shadow: 0 0 15px rgba(32, 78, 241, 0.8);
            border-color: #dce5f4;
        }
        
        .chart-container {
            height: 500px;
            background: #000000;
            padding: 20px;
            border: 1px solid #204ef1;
        }
        
        .status-bar {
            padding: 12px 20px;
            background: rgba(39, 31, 54, 0.3);
            margin-top: 15px;
            font-size: 13px;
            color: #dce5f4;
            border-left: 3px solid #204ef1;
            font-family: "Anton", sans-serif;
        }
        
        .status-bar::before {
            content: '// ';
            color: #204ef1;
        }
        
        ::-webkit-scrollbar {
            width: 10px;
        }
        
        ::-webkit-scrollbar-track {
            background: #000000;
        }
        
        ::-webkit-scrollbar-thumb {
            background: #204ef1;
            border: 1px solid #271f36;
        }
        
        ::-webkit-scrollbar-thumb:hover {
            background: #dce5f4;
        }
        
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #dce5f4;
            font-family: "Share Tech Mono";
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>ASM Footprint Sniffer</h1>
        
        <div class="terminal-header">
            <div class="terminal-dot"></div>
            <div class="terminal-dot"></div>
            <div class="terminal-dot"></div>
            <div class="terminal-title">System Summary</div>
        </div>
        <div class="card">
            <div class="card-content">
                <div class="stats-grid">
                    <div class="stat">
                        <span class="stat-value" id="total-files">0</span>
                        <span class="stat-label">Files Processed</span>
                    </div>
                    <div class="stat">
                        <span class="stat-value" id="files-with-iocs">0</span>
                        <span class="stat-label">Files with IoCs</span>
                    </div>
                    <div class="stat">
                        <span class="stat-value" id="total-iocs">0</span>
                        <span class="stat-label">Total IoCs Found</span>
                    </div>
                    <div class="stat">
                        <span class="stat-value" id="files-with-hashes">0</span>
                        <span class="stat-label">Files with Hashes</span>
                    </div>
                </div>
            </div>
        </div>
        
        <div class="terminal-header">
            <div class="terminal-dot"></div>
            <div class="terminal-dot"></div>
            <div class="terminal-dot"></div>
            <div class="terminal-title">IoC Distribution</div>
        </div>
        <div class="card">
            <div class="card-content">
                <div class="controls">
                    <button class="btn" onclick="exportCategoryChart()">Export PNG</button>
                </div>
                <div class="chart-container">
                    <canvas id="categoryChart"></canvas>
                </div>
            </div>
        </div>
        
        <div class="terminal-header">
            <div class="terminal-dot"></div>
            <div class="terminal-dot"></div>
            <div class="terminal-dot"></div>
            <div class="terminal-title">File Heat Map</div>
        </div>
        <div class="card">
            <div class="card-content">
                <div class="controls">
                    <button class="btn" onclick="exportHeatmap()">Export PNG</button>
                </div>
                <div id="heatmap"></div>
            </div>
        </div>
        
        <div class="terminal-header">
            <div class="terminal-dot"></div>
            <div class="terminal-dot"></div>
            <div class="terminal-dot"></div>
            <div class="terminal-title">Detailed Results</div>
        </div>
        <div class="card">
            <div class="card-content">
                <div class="controls">
                    <label>Filter: </label>
                    <input type="text" id="search-filter" placeholder="search files or IoCs...">
                    <label>Category: </label>
                    <select id="category-filter">
                        <option value="">All Categories</option>
                    </select>
                    <button class="btn" onclick="expandAll()">Expand All</button>
                    <button class="btn" onclick="collapseAll()">Collapse All</button>
                </div>
                <div class="status-bar" id="results-status">click file headers to expand/collapse details</div>
                <div id="results-container"></div>
            </div>
        </div>
    </div>
    
    <script>
        let scanData = [];
        let categoryChart = null;
        let allCategories = new Set();
        
        const CATEGORY_NAMES = {
            'protocols_full': 'Protocol URLs',
            'urls': 'URLs',
            'domains': 'Domains',
            'files': 'Files',
            'main_patterns': 'Main Functions/Variables',
            'ssh_patterns': 'SSH Client References',
            'openssh_full': 'OpenSSH Full References',
            'operational_files': 'Operational Files',
            'dependency_paths': 'Dependency/Library Paths'
        };
        
        async function loadData() {
            try {
                const data = await fetch('asm_footprint_result.json').then(r => r.json());
                return data;
            } catch (error) {
                console.error('Error Loading Data:', error);
                return [];
            }
        }
        
        async function init() {
            scanData = await loadData();
            
            if (!scanData || scanData.length === 0) {
                showEmptyState();
                return;
            }
            
            updateSummaryStats();
            collectCategories();
            renderCategoryChart();
            renderHeatmap();
            renderResults();
            setupFilters();
        }
        
        function showEmptyState() {
            document.getElementById('results-container').innerHTML = `
                <div class="empty-state">
                    <div>No scan results found. Make sure asm_footprint_result.json exists.</div>
                </div>
            `;
        }
        
        function updateSummaryStats() {
            const totalFiles = scanData.length;
            const filesWithIocs = scanData.filter(r => r.iocs).length;
            const filesWithHashes = scanData.filter(r => r.file_hashes).length;
            
            let totalIocs = 0;
            scanData.forEach(result => {
                if (result.iocs) {
                    Object.values(result.iocs).forEach(iocList => {
                        totalIocs += iocList.length;
                    });
                }
            });
            
            document.getElementById('total-files').textContent = totalFiles;
            document.getElementById('files-with-iocs').textContent = filesWithIocs;
            document.getElementById('total-iocs').textContent = totalIocs;
            document.getElementById('files-with-hashes').textContent = filesWithHashes;
        }
        
        function collectCategories() {
            scanData.forEach(result => {
                if (result.iocs) {
                    Object.keys(result.iocs).forEach(cat => allCategories.add(cat));
                }
            });
            
            const categoryFilter = document.getElementById('category-filter');
            Array.from(allCategories).sort().forEach(cat => {
                const option = document.createElement('option');
                option.value = cat;
                option.textContent = CATEGORY_NAMES[cat] || cat;
                categoryFilter.appendChild(option);
            });
        }
        
        function renderCategoryChart() {
            const categoryCounts = {};
            
            scanData.forEach(result => {
                if (result.iocs) {
                    Object.entries(result.iocs).forEach(([category, iocs]) => {
                        categoryCounts[category] = (categoryCounts[category] || 0) + iocs.length;
                    });
                }
            });
            
            const sortedCategories = Object.entries(categoryCounts)
                .sort((a, b) => b[1] - a[1]);
            
            const labels = sortedCategories.map(([cat]) => CATEGORY_NAMES[cat] || cat);
            const data = sortedCategories.map(([, count]) => count);
            
            const ctx = document.getElementById('categoryChart').getContext('2d');
            
            if (categoryChart) {
                categoryChart.destroy();
            }
            
            categoryChart = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: labels,
                    datasets: [{
                        label: 'IoC Count',
                        data: data,
                        backgroundColor: 'rgba(32, 78, 241, 0.6)',
                        borderColor: '#204ef1',
                        borderWidth: 2
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: {
                            labels: {
                                color: '#dce5f4',
                                font: {
                                    family: 'Share Tech Mono',
                                    size: 12
                                }
                            }
                        }
                    },
                    scales: {
                        y: {
                            beginAtZero: true,
                            ticks: {
                                color: '#dce5f4',
                                font: {
                                    family: 'Share Tech Mono'
                                }
                            },
                            grid: {
                                color: 'rgba(32, 78, 241, 0.2)'
                            }
                        },
                        x: {
                            ticks: {
                                color: '#dce5f4',
                                font: {
                                    family: 'Share Tech Mono'
                                }
                            },
                            grid: {
                                color: 'rgba(32, 78, 241, 0.2)'
                            }
                        }
                    }
                }
            });
        }

        function renderHeatmap() {
            const fileNames = scanData.map(r => r.file.split('/').pop());
            const categories = Array.from(allCategories).sort();
            const zData = fileNames.map(fileName => {
                const result = scanData.find(r => r.file.endsWith(fileName));
                return categories.map(category => {
                if (result && result.iocs && result.iocs[category]) {
                    return result.iocs[category].length;
                }
                return 0;
                });
            });
            
            Plotly.newPlot('heatmap', [{
                z: zData,
                x: categories.map(category => CATEGORY_NAMES[category] || category),
                y: fileNames,
                type: 'heatmap',
                colorscale: [
                [0, '#FFFACD'],
                [0.2, '#FFD700'], 
                [0.4, '#FFA500'],
                [0.6, '#FF6347'],
                [0.8, '#FF4500'],
                [1, '#8B0000']
                ],
                hoverongaps: false
            }], {
                title: { text: '', font: { color: '#dce5f4' } },
                xaxis: {
                tickangle: -45,
                tickfont: { color: '#dce5f4', family: 'Share Tech Mono', size: 10 },
                gridcolor: '#204ef1'
                },
                yaxis: {
                tickangle: 0,
                tickfont: { color: '#dce5f4', family: 'Share Tech Mono', size: 10 },
                gridcolor: '#204ef1'
                },
                paper_bgcolor: '#000000',
                plot_bgcolor: '#000000',
                height: 600
            });
            }

        function renderResults(filterText = '', filterCategory = '') {
            const container = document.getElementById('results-container');
            container.innerHTML = '';
            
            let displayedCount = 0;
            
            scanData.forEach((result, index) => {
                if (!matchesFilter(result, filterText, filterCategory)) {
                    return;
                }
                
                displayedCount++;
                const fileDiv = document.createElement('div');
                fileDiv.className = 'file-result' + (result.error ? ' has-error' : '');
                fileDiv.id = `file-${index}`;
                
                const fileName = result.file.split('/').pop();
                let badgeText = '';
                let badgeClass = '';
                
                if (result.error) {
                    badgeText = 'ERROR';
                    badgeClass = 'error';
                } else if (result.iocs) {
                    const iocCount = Object.values(result.iocs).reduce((sum, list) => sum + list.length, 0);
                    badgeText = `${iocCount} IoCs`;
                }
                
                fileDiv.innerHTML = `
                    <div class="file-header" onclick="toggleFile(${index})">
                        <span class="file-name">${fileName}</span>
                        ${badgeText ? `<span class="file-badge ${badgeClass}">${badgeText}</span>` : ''}
                    </div>
                    <div class="file-content collapsed" id="content-${index}">
                        ${renderFileContent(result)}
                    </div>
                `;
                
                container.appendChild(fileDiv);
            });
            
            const status = document.getElementById('results-status');
            status.textContent = `displaying ${displayedCount} of ${scanData.length} files`;
        }
        
        function renderFileContent(result) {
            let html = '';
            
            if (result.error) {
                html += `<div class="error-message">Error: ${result.error}</div>`;
                return html;
            }
            
            if (result.file_hashes) {
                html += '<div class="hash-section">';
                html += '<div class="hash-title">File Hashes</div>';
                Object.entries(result.file_hashes).forEach(([type, hash]) => {
                    html += `<div class="hash-item"><span class="hash-label">${type.toUpperCase()}:</span> ${hash}</div>`;
                });
                html += '</div>';
            }
            
            if (result.iocs) {
                Object.entries(result.iocs).forEach(([category, iocs]) => {
                    html += '<div class="ioc-category">';
                    html += `<div class="category-title">${CATEGORY_NAMES[category] || category} (${iocs.length})</div>`;
                    html += '<div class="ioc-list">';
                    iocs.forEach(ioc => {
                        html += `<div class="ioc-item">${escapeHtml(ioc)}</div>`;
                    });
                    html += '</div></div>';
                });
            }
            
            return html || '<div class="empty-state">No IoCs found in this file.</div>';
        }
        
        function matchesFilter(result, filterText, filterCategory) {
            if (filterText) {
                const searchLower = filterText.toLowerCase();
                const fileNameMatch = result.file.toLowerCase().includes(searchLower);
                
                let iocMatch = false;
                if (result.iocs) {
                    iocMatch = Object.values(result.iocs).some(iocList => 
                        iocList.some(ioc => ioc.toLowerCase().includes(searchLower))
                    );
                }
                
                if (!fileNameMatch && !iocMatch) {
                    return false;
                }
            }
            
            if (filterCategory) {
                if (!result.iocs || !result.iocs[filterCategory]) {
                    return false;
                }
            }
            
            return true;
        }
        
        function setupFilters() {
            const searchInput = document.getElementById('search-filter');
            const categorySelect = document.getElementById('category-filter');
            
            searchInput.addEventListener('input', (e) => {
                renderResults(e.target.value, categorySelect.value);
            });
            
            categorySelect.addEventListener('change', (e) => {
                renderResults(searchInput.value, e.target.value);
            });
        }
        
        function toggleFile(index) {
            const content = document.getElementById(`content-${index}`);
            content.classList.toggle('collapsed');
        }
        
        function expandAll() {
            document.querySelectorAll('.file-content').forEach(el => {
                el.classList.remove('collapsed');
            });
        }
        
        function collapseAll() {
            document.querySelectorAll('.file-content').forEach(el => {
                el.classList.add('collapsed');
            });
        }
        
        function exportCategoryChart() {
            const link = document.createElement('a');
            link.download = 'ioc_category_chart.png';
            link.href = categoryChart.toBase64Image();
            link.click();
        }
        
        function exportHeatmap() {
            Plotly.downloadImage('heatmap', { 
                format: 'png', 
                width: 1920, 
                height: 1080, 
                filename: 'ioc_heatmap' 
            });
        }
        
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
        
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', init);
        } else {
            init();
        }
    </script>
</body>
</html>
